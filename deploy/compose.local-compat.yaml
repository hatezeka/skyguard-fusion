# Local Windows Docker Desktop compatibility: NOT a public/HTTPS deployment.
# Override the base compose: no passwords, tokens, hashes, or session keys here.
services:
  postgres:
    image: postgres:17-bookworm
    platform: linux/amd64
  gateway:
    ports:
      - '127.0.0.1:8088:8080'
    networks:
      - internal
      - web
    environment:
      SKYGUARD_PUBLIC_ORIGIN: 'http://127.0.0.1:8088'
      SKYGUARD_SECURE_COOKIES: 'false'
  caddy:
    profiles:
      - https-edge
